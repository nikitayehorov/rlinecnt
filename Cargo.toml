[package]
name = "rlinecnt"
version = "1.0.0"
edition = "2021"
authors = ["Nikita Yehorov <nikita.yehorov@e-u.edu.ua>"]
description = "Cross-platform high-performance line count system utility in Rust (Variant 20)"
license = "MIT"
repository = "https://github.com/nikitayehorov/rlinecnt"
readme = "README.md"
keywords = ["cli", "wc", "line-count", "simd", "systems-programming"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
memchr = "2.7"
memmap2 = "0.9"
rayon = "1.10"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
